<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="禁欲タイマー" />
  <title>禁欲タイマー</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PERSONAL TRACKER</p>
        <h1>禁欲タイマー</h1>
      </div>
      <button id="recordsButton" class="icon-button" type="button" aria-label="記録を見る">記録</button>
    </header>

    <section id="timerView" class="view active" aria-labelledby="timerHeading">
      <div class="hero-card">
        <p id="timerHeading" class="section-label">現在の継続時間</p>
        <div id="elapsedTime" class="elapsed">未開始</div>
        <p id="startedAt" class="muted">「オナ禁開始」を押すと計測を始めます。</p>

        <button id="startButton" class="primary-button" type="button">オナ禁開始</button>
        <button id="resetButton" class="danger-button hidden" type="button">リセットして記録</button>
      </div>

      <button id="monthSummaryButton" class="summary-card" type="button">
        <span>
          <span class="section-label">今月のリセット回数</span>
          <strong id="currentMonthLabel">—</strong>
        </span>
        <span id="currentMonthCount" class="count">0回</span>
      </button>

      <p class="privacy-note">記録はこの端末のブラウザ内に保存されます。サーバーへ送信しません。</p>
    </section>

    <section id="recordsView" class="view" aria-labelledby="recordsHeading">
      <div class="records-header">
        <button id="backButton" class="text-button" type="button">← 戻る</button>
        <h2 id="recordsHeading">記録</h2>
        <span class="spacer" aria-hidden="true"></span>
      </div>

      <div class="month-nav">
        <button id="prevMonth" class="month-button" type="button" aria-label="前の月">‹</button>
        <div>
          <p class="section-label">表示中</p>
          <strong id="recordsMonthLabel">—</strong>
        </div>
        <button id="nextMonth" class="month-button" type="button" aria-label="次の月">›</button>
      </div>

      <div class="record-count-card">
        <span>リセット回数</span>
        <strong id="recordsMonthCount">0回</strong>
      </div>

      <p class="records-caption">各リセットまでの「前回からの時間」</p>
      <ol id="recordsList" class="records-list"></ol>
      <p id="emptyRecords" class="empty-state">この月の記録はありません。</p>

      <details class="backup-panel">
        <summary>バックアップ</summary>
        <p>端末のサイトデータを消すと記録も消える可能性があります。ときどき書き出しておくと安心です。</p>
        <div class="backup-actions">
          <button id="exportButton" class="secondary-button" type="button">JSONを書き出す</button>
          <label class="secondary-button file-label">
            JSONを読み込む
            <input id="importInput" type="file" accept="application/json,.json" />
          </label>
        </div>
      </details>
    </section>
  </main>

  <dialog id="resetDialog" class="dialog">
    <form method="dialog">
      <h2>リセットしますか？</h2>
      <p>現在時刻を1回分の記録として保存し、タイマーを0から再開します。</p>
      <div class="dialog-actions">
        <button value="cancel" class="secondary-button">キャンセル</button>
        <button id="confirmReset" value="default" class="danger-button">リセット</button>
      </div>
    </form>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
